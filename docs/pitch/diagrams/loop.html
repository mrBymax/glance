<svg class="dg" viewBox="0 0 1728 384" width="1728" height="384" style="min-width:1728px" role="img" aria-labelledby="loop-title loop-desc" xmlns="http://www.w3.org/2000/svg"><title id="loop-title">The Glance loop</title><desc id="loop-desc">Four steps: look at a Glance code, hear what a nod will do, nod to confirm, and the place acts on the answer; the next code starts the loop again.</desc><g class="dg-arrow"><path d="M320,64 H590" fill="none" stroke="#6a6a6a" stroke-width="2.5"/><polygon points="590,64 576,57 576,71" fill="#6a6a6a"/></g><g class="dg-arrow"><path d="M730,64 H1000" fill="none" stroke="#6a6a6a" stroke-width="2.5"/><polygon points="1000,64 986,57 986,71" fill="#6a6a6a"/></g><g class="dg-arrow"><path d="M1140,64 H1410" fill="none" stroke="#6a6a6a" stroke-width="2.5"/><polygon points="1410,64 1396,57 1396,71" fill="#6a6a6a"/></g><g class="dg-arrow"><path d="M1536,64 H1696 Q1704,64 1704,72 V352 Q1704,360 1696,360 H32 Q24,360 24,352 V72 Q24,64 32,64 H180" fill="none" stroke="#6a6a6a" stroke-width="2.5" stroke-dasharray="10 8"/><polygon points="180,64 166,57 166,71" fill="#6a6a6a"/></g><g class="dg-label"><rect x="605.8" y="316" width="516.5" height="36" rx="4" fill="#f1f1f1"/><text x="864" y="342" font-size="26" font-weight="500" fill="#474747" text-anchor="middle">The next code starts the loop again</text></g><circle cx="250" cy="64" r="56" fill="#ffffff" stroke="rgba(0,0,0,0.16)" stroke-width="2"/><text x="250" y="80" font-size="46" font-weight="700" fill="#000000" text-anchor="middle">1</text><g transform="translate(154 150) scale(1.6666666666666667)" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="1"/><path d="M18.944 12.33a1 1 0 0 0 0-.66 7.5 7.5 0 0 0-13.888 0 1 1 0 0 0 0 .66 7.5 7.5 0 0 0 13.888 0"/></g><text x="204" y="186" font-size="46" font-weight="650" fill="#000000" text-anchor="start">Look</text><text x="250" y="240" font-size="30" font-weight="400" fill="#474747" text-anchor="middle">Look at a Glance code,</text><text x="250" y="278" font-size="30" font-weight="400" fill="#474747" text-anchor="middle">or at a product.</text><circle cx="660" cy="64" r="56" fill="#ffffff" stroke="rgba(0,0,0,0.16)" stroke-width="2"/><text x="660" y="80" font-size="46" font-weight="700" fill="#000000" text-anchor="middle">2</text><g transform="translate(564 150) scale(1.6666666666666667)" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></g><text x="614" y="186" font-size="46" font-weight="650" fill="#000000" text-anchor="start">Hear</text><text x="660" y="240" font-size="30" font-weight="400" fill="#474747" text-anchor="middle">The voice says what it is</text><text x="660" y="278" font-size="30" font-weight="400" fill="#474747" text-anchor="middle">and what a nod will do.</text><circle cx="1070" cy="64" r="56" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="2"/><text x="1070" y="80" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><g transform="translate(974 150) scale(1.6666666666666667)" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></g><text x="1024" y="186" font-size="46" font-weight="650" fill="#000000" text-anchor="start">Nod</text><text x="1070" y="240" font-size="30" font-weight="400" fill="#474747" text-anchor="middle">A nod confirms.</text><text x="1070" y="278" font-size="30" font-weight="400" fill="#474747" text-anchor="middle">A shake says no.</text><circle cx="1480" cy="64" r="56" fill="#ffffff" stroke="rgba(0,0,0,0.16)" stroke-width="2"/><text x="1480" y="80" font-size="46" font-weight="700" fill="#000000" text-anchor="middle">4</text><g transform="translate(1384 150) scale(1.6666666666666667)" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></g><text x="1434" y="186" font-size="46" font-weight="650" fill="#000000" text-anchor="start">Done</text><text x="1480" y="240" font-size="30" font-weight="400" fill="#474747" text-anchor="middle">The place gets the answer</text><text x="1480" y="278" font-size="30" font-weight="400" fill="#474747" text-anchor="middle">and acts on it.</text></svg>
