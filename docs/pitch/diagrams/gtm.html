<svg class="dg" viewBox="0 0 1728 520" width="1728" height="520" style="min-width:1728px" role="img" aria-labelledby="gtm-title gtm-desc" xmlns="http://www.w3.org/2000/svg"><title id="gtm-title">Path to adoption</title><desc id="gtm-desc">Three phases: a pilot at one store checkout, then more places with a fixed offer such as a bus fare or a gate, then the loop as a feature inside the glasses.</desc><g class="dg-arrow"><path d="M128,56 H584" fill="none" stroke="#6a6a6a" stroke-width="2.5"/><polygon points="584,56 570,49 570,63" fill="#6a6a6a"/></g><g class="dg-arrow"><path d="M728,56 H1184" fill="none" stroke="#6a6a6a" stroke-width="2.5"/><polygon points="1184,56 1170,49 1170,63" fill="#6a6a6a"/></g><circle cx="56" cy="56" r="52" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="2"/><text x="56" y="72" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="0" y="176" font-size="42" font-weight="650" fill="#000000" text-anchor="start">Store pilot</text><text x="0" y="228" font-size="28" font-weight="400" fill="#000000" text-anchor="start">One store, one checkout,</text><text x="0" y="268" font-size="28" font-weight="400" fill="#000000" text-anchor="start">a staffed lane beside it.</text><text x="0" y="308" font-size="28" font-weight="400" fill="#000000" text-anchor="start">Count the nods that pay,</text><text x="0" y="348" font-size="28" font-weight="400" fill="#000000" text-anchor="start">any yes by mistake, the time.</text><line x1="0" x2="500" y1="412" y2="412" stroke="rgba(0,0,0,0.16)" stroke-width="2"/><text x="0" y="452" font-size="24" font-weight="650" fill="#474747" text-anchor="start">Needs</text><text x="96" y="452" font-size="24" font-weight="400" fill="#474747" text-anchor="start">A payment provider</text><text x="96" y="486" font-size="24" font-weight="400" fill="#474747" text-anchor="start">The list of the store</text><circle cx="656" cy="56" r="52" fill="#ffffff" stroke="rgba(0,0,0,0.16)" stroke-width="2"/><text x="656" y="72" font-size="44" font-weight="700" fill="#000000" text-anchor="middle">2</text><text x="600" y="176" font-size="42" font-weight="650" fill="#000000" text-anchor="start">More places</text><text x="600" y="228" font-size="28" font-weight="400" fill="#000000" text-anchor="start">Places with a fixed offer:</text><text x="600" y="268" font-size="28" font-weight="400" fill="#000000" text-anchor="start">a bus fare, a gate, a machine.</text><text x="600" y="308" font-size="28" font-weight="400" fill="#000000" text-anchor="start">Each one shows a code and</text><text x="600" y="348" font-size="28" font-weight="400" fill="#000000" text-anchor="start">acts on the result.</text><line x1="600" x2="1100" y1="412" y2="412" stroke="rgba(0,0,0,0.16)" stroke-width="2"/><text x="600" y="452" font-size="24" font-weight="650" fill="#474747" text-anchor="start">Needs</text><text x="696" y="452" font-size="24" font-weight="400" fill="#474747" text-anchor="start">A place states its own offer</text><text x="696" y="486" font-size="24" font-weight="400" fill="#474747" text-anchor="start">(the next part to build)</text><circle cx="1256" cy="56" r="52" fill="#ffffff" stroke="rgba(0,0,0,0.16)" stroke-width="2"/><text x="1256" y="72" font-size="44" font-weight="700" fill="#000000" text-anchor="middle">3</text><text x="1200" y="176" font-size="42" font-weight="650" fill="#000000" text-anchor="start">In the glasses</text><text x="1200" y="228" font-size="28" font-weight="400" fill="#000000" text-anchor="start">The loop as a feature of</text><text x="1200" y="268" font-size="28" font-weight="400" fill="#000000" text-anchor="start">the glasses: no phone app,</text><text x="1200" y="308" font-size="28" font-weight="400" fill="#000000" text-anchor="start">one code format,</text><text x="1200" y="348" font-size="28" font-weight="400" fill="#000000" text-anchor="start">any place can register.</text><line x1="1200" x2="1700" y1="412" y2="412" stroke="rgba(0,0,0,0.16)" stroke-width="2"/><text x="1200" y="452" font-size="24" font-weight="650" fill="#474747" text-anchor="start">Needs</text><text x="1296" y="452" font-size="24" font-weight="400" fill="#474747" text-anchor="start">Work with Meta on</text><text x="1296" y="486" font-size="24" font-weight="400" fill="#474747" text-anchor="start">the glasses side</text></svg>
